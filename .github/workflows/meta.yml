name: Leader reports (Mon + Thu) + Monday rankings
on:
  schedule:
    - cron: '7 17 * * 1'
    - cron: '7 17 * * 4'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: tdm-state
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then python scripts/meta_feeds.py --rankings; fi
          python scripts/leader_month.py
        env:
          WEBHOOK_OP_META: ${{ secrets.WEBHOOK_OP_META }}
          WEBHOOK_LATEST5_ENEL: ${{ secrets.WEBHOOK_LATEST5_ENEL }}
          WEBHOOK_LATEST5_LUFFY: ${{ secrets.WEBHOOK_LATEST5_LUFFY }}
          WEBHOOK_LATEST5_NAMI: ${{ secrets.WEBHOOK_LATEST5_NAMI }}
          WEBHOOK_LATEST5_TEACH: ${{ secrets.WEBHOOK_LATEST5_TEACH }}
          WEBHOOK_LATEST5_XEBEC: ${{ secrets.WEBHOOK_LATEST5_XEBEC }}
          WEBHOOK_LATEST5_IMU: ${{ secrets.WEBHOOK_LATEST5_IMU }}
      - name: Save state
        if: always()
        run: |
          git config user.name "tdm-webhooks"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "state: leader reports [skip ci]" && git pull --rebase && git push)
