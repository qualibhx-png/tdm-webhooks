name: Buy-sell price checks
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: tdm-state
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run
        run: python scripts/price_check.py 
        env:
          WEBHOOK_BUY_SELL: ${{ secrets.WEBHOOK_BUY_SELL }}
          DISCORD_READ_BOT_TOKEN: ${{ secrets.DISCORD_READ_BOT_TOKEN }}
          BUYSELL_CHANNEL_ID: ${{ secrets.BUYSELL_CHANNEL_ID }}
          PRICECHARTING_TOKEN: ${{ secrets.PRICECHARTING_TOKEN }}
          COMPSAPI_KEY: ${{ secrets.COMPSAPI_KEY }}
      - name: Save state
        if: always()
        run: |
          git config user.name "tdm-webhooks"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "state: Buy-sell price checks [skip ci]" && git pull --rebase && git push)
