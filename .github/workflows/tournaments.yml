name: Tournament results
on:
  schedule:
    - cron: '15 */3 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: tdm-state
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run
        run: python scripts/tournaments.py 
        env:
          WEBHOOK_RESULTS_ONEPIECE: ${{ secrets.WEBHOOK_RESULTS_ONEPIECE }}
          WEBHOOK_RESULTS_RIFTBOUND: ${{ secrets.WEBHOOK_RESULTS_RIFTBOUND }}
          WEBHOOK_RESULTS_NARUTO: ${{ secrets.WEBHOOK_RESULTS_NARUTO }}
          LIMITLESS_API_KEY: ${{ secrets.LIMITLESS_API_KEY }}
      - name: Save state
        if: always()
        run: |
          git config user.name "tdm-webhooks"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "state: Tournament results [skip ci]" && git pull --rebase && git push)
