name: Tournament results
on:
  schedule:
    - cron: '15,45 * * * *'
  workflow_dispatch:
    inputs:
      seed_chinoize:
        description: 'Go-live: remember all results, post only the newest ChinoizeCup (type yes)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: tdm-state
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser for decklist screenshots
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Run
        run: |
          if [ "${{ github.event.inputs.seed_chinoize }}" = "yes" ]; then python scripts/tournaments.py --seed-chinoize; else python scripts/tournaments.py; fi
        env:
          WEBHOOK_RESULTS_ONEPIECE: ${{ secrets.WEBHOOK_RESULTS_ONEPIECE }}
          WEBHOOK_RESULTS_RIFTBOUND: ${{ secrets.WEBHOOK_RESULTS_RIFTBOUND }}
          WEBHOOK_RESULTS_NARUTO: ${{ secrets.WEBHOOK_RESULTS_NARUTO }}
          LIMITLESS_API_KEY: ${{ secrets.LIMITLESS_API_KEY }}
      - name: Save state
        if: always()
        run: |
          git config user.name "tdm-webhooks"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "state: Tournament results [skip ci]" && git pull --rebase && git push)
