name: Official news & reveals
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: tdm-state
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run
        run: python scripts/news_watch.py 
        env:
          WEBHOOK_TCG_NEWS: ${{ secrets.WEBHOOK_TCG_NEWS }}
          WEBHOOK_SET_REVEALS: ${{ secrets.WEBHOOK_SET_REVEALS }}
      - name: Save state
        if: always()
        run: |
          git config user.name "tdm-webhooks"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "state: Official news & reveals [skip ci]" && git pull --rebase && git push)
